[project]
name = "discord-pin-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohappyeyeballs==2.4.3",
    "aiohttp==3.10.10",
    "aiosignal==1.3.1",
    "attrs==24.2.0",
    "discord-py>=2.4.0",
    "frozenlist==1.5.0",
    "idna==3.10",
    "multidict==6.1.0",
    "propcache==0.2.0",
    "python-dotenv==1.0.1",
    "rapidfuzz>=3.14.3",
    "yarl==1.17.1",
]

[tool.basedpyright]
include = ["pebble"]
executionEnvironments = [ { root = "pebble" } ]

typeCheckingMode = "recommended"
reportUnusedCallResult = false
reportExplicitAny = false
reportAny = false
